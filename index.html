<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskOrbit | Drag & Drop Productivity Board</title>
  <meta name="description" content="A gorgeous, interactive Kanban board featuring drag-and-drop tasks, custom list columns, date-time deadlines, and integrated countdown timers with local persistence.">
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Gradient Background Elements -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- App Shell -->
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <div class="logo-text">
          <h1>TaskOrbit <span class="branding-by">by vibing Phiem</span></h1>
          <p class="subtitle">Streamline your flow</p>
        </div>
      </div>

      <!-- Current Date and Time -->
      <div class="header-datetime" id="header-datetime">
        <span class="header-time" id="header-time"></span>
        <span class="header-date" id="header-date"></span>
      </div>

      <div class="header-actions">
        <button id="toggle-sound-btn" class="btn btn-secondary" title="Toggle sound alerts">
          <svg id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 0.9rem; height: 0.9rem;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span id="sound-status-text">Sound On</span>
        </button>

        <button id="autosave-config-btn" class="btn btn-secondary" title="Configure Autosave Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 0.9rem; height: 0.9rem;">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="autosave-status-text">Autosave: LocalStorage</span>
          <span id="autosave-status-dot" class="autosave-status-dot success"></span>
        </button>

        <button id="export-session-btn" class="btn btn-secondary" title="Export session to file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 0.9rem; height: 0.9rem;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export
        </button>
        <button id="import-session-btn" class="btn btn-secondary" title="Import session from file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 0.9rem; height: 0.9rem;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Import
        </button>
        <input type="file" id="import-session-file" accept=".json" style="display: none;">
      </div>
    </header>

    <!-- Main Board Area -->
    <main class="board-viewport">
      <div class="board-canvas" id="board-canvas">
        <!-- Lists (columns) will be dynamically rendered here -->
      </div>
    </main>
  </div>

  <!-- Task Detail Modal Dialog -->
  <dialog id="task-modal" class="modal">
    <form method="dialog" class="modal-form">
      <div class="modal-header">
        <div class="modal-title-container">
          <h2>Task Details</h2>
          <span class="modal-datetime-display"></span>
        </div>
        <button type="button" class="btn-close" id="close-modal-btn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="modal-task-id">
        <input type="hidden" id="modal-list-id">

        <div class="form-group">
          <label for="modal-task-title">Title</label>
          <input type="text" id="modal-task-title" required placeholder="What needs to be done?">
        </div>

        <div class="form-group">
          <label for="modal-task-note">Notes</label>
          <textarea id="modal-task-note" rows="4" placeholder="Add some details..."></textarea>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="modal-task-due">Due Date & Time</label>
            <input type="datetime-local" id="modal-task-due">
          </div>
          
          <div class="form-group">
            <label>Timer Settings</label>
            <div class="timer-setup-inputs">
              <input type="number" id="modal-timer-min" min="0" max="999" placeholder="Min" aria-label="Minutes">
              <span class="colon">:</span>
              <input type="number" id="modal-timer-sec" min="0" max="59" placeholder="Sec" aria-label="Seconds">
            </div>
            <p class="field-hint">Leave blank or 0 to exclude timer.</p>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="modal-delete-btn">Delete Task</button>
        <button type="submit" class="btn btn-primary" id="modal-save-btn">Save Changes</button>
      </div>
    </form>
  </dialog>

  <!-- Alert Modal Dialog -->
  <dialog id="alert-modal" class="modal">
    <form method="dialog" class="modal-form">
      <div class="modal-header">
        <div class="modal-title-container">
          <h2 id="alert-title">Notification</h2>
          <span class="modal-datetime-display"></span>
        </div>
      </div>
      <div class="modal-body">
        <p id="alert-message" style="font-size: 0.9rem; line-height: 1.5; color: var(--text-main); margin-bottom: 0.5rem;"></p>
        
        <!-- Up Next Section (Alert Modal) -->
        <div class="focus-next-task-container" id="alert-next-task-container" style="display: none; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 1.25rem; margin-top: 0.75rem; flex-direction: column; align-items: center; gap: 0.5rem; width: 100%;">
          <div class="next-task-label">Up Next in column</div>
          <div class="next-task-content" style="width: 100%; display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 0.75rem 1rem; gap: 1rem;">
            <span class="next-task-title" id="alert-next-task-title">Next Task Name</span>
            <div class="next-task-timer-wrapper" id="alert-next-task-timer-wrapper" style="display: flex; align-items: center; gap: 0.35rem;">
              <button type="button" class="next-task-timer-btn" id="alert-next-task-timer-btn" title="Start Next Task">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <span class="next-task-timer-time" id="alert-next-task-timer-time">00:00</span>
              </button>
              <button type="button" class="next-task-edit-btn" id="alert-next-task-edit-btn" title="Edit Timer" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-muted); cursor: pointer; padding: 0.4rem; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all var(--transition-fast);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 0.75rem; height: 0.75rem;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
            </div>
            
            <!-- Next Task Timer Setup (Alert Modal) -->
            <div class="next-task-timer-setup" id="alert-next-task-timer-setup" style="display: none; align-items: center; gap: 0.35rem;">
              <input type="number" class="inline-time-in min alert-next-min" min="0" max="999" placeholder="MM" value="25" style="width: 42px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; text-align: center; font-size: 0.75rem; padding: 0.2rem 0;">
              <span style="color: rgba(255,255,255,0.4); font-size: 0.75rem;">:</span>
              <input type="number" class="inline-time-in sec alert-next-sec" min="0" max="59" placeholder="SS" value="00" style="width: 42px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; text-align: center; font-size: 0.75rem; padding: 0.2rem 0;">
              <button type="button" class="next-timer-set-btn alert-next-set-btn" style="background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--accent-success); border-radius: 4px; cursor: pointer; padding: 0.2rem 0.5rem; font-size: 0.75rem;">Set</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer" style="justify-content: flex-end;">
        <button type="submit" class="btn btn-primary" id="alert-dismiss-btn">Dismiss</button>
      </div>
    </form>
  </dialog>

  <!-- Accessibility / Mobile Task Options Dropdown (Global popover) -->
  <div id="task-menu-popover" popover class="task-menu-dropdown">
    <ul class="task-menu-list">
      <li>
        <button class="menu-action" id="menu-edit-task">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit Details
        </button>
      </li>
      <li class="menu-divider">Move To List</li>
      <li id="menu-move-destinations">
        <!-- Rendered dynamically -->
      </li>
      <li class="menu-divider"></li>
      <li>
        <button class="menu-action action-danger" id="menu-delete-task">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Delete Task
        </button>
      </li>
    </ul>
  </div>

  <!-- Focus Overlay Dialog (Minimizable to bottom-right corner) -->
  <div id="focus-overlay" class="focus-overlay hidden">
    <div class="focus-card">
      <button class="btn-focus-minimize" id="focus-btn-minimize" title="Minimize Focus Mode">
        <svg class="minimize-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="10" y1="14" x2="3" y2="21"></line></svg>
        <svg class="maximize-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
      </button>
      <div class="focus-title">Focus Session</div>
      <div class="focus-datetime-display" id="focus-datetime-display" style="font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 0.75rem; font-weight: 500; text-align: center;"></div>
      <div class="focus-task-name" id="focus-task-name">Task Name</div>
      <div class="focus-time" id="focus-time">00:00</div>
      <div class="focus-controls">
        <button class="focus-btn focus-btn-toggle" id="focus-btn-toggle" title="Pause Timer"></button>
        <button class="focus-btn focus-btn-delete" id="focus-btn-delete" title="Reset/Delete Timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
      <!-- Up Next Section -->
      <div class="focus-next-task-container" id="focus-next-task-container" style="display: none;">
        <div class="next-task-label">Up Next in column</div>
        <div class="next-task-content">
          <span class="next-task-title" id="focus-next-task-title">Next Task Name</span>
          <div class="next-task-timer-wrapper" id="focus-next-task-timer-wrapper" style="display: flex; align-items: center; gap: 0.35rem;">
            <button type="button" class="next-task-timer-btn" id="focus-next-task-timer-btn" title="Start Next Task">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <span class="next-task-timer-time" id="focus-next-task-timer-time">00:00</span>
            </button>
            <button type="button" class="next-task-edit-btn" id="focus-next-task-edit-btn" title="Edit Timer" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-muted); cursor: pointer; padding: 0.4rem; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all var(--transition-fast);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 0.75rem; height: 0.75rem;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
          </div>
          
          <!-- Next Task Timer Setup (Focus Overlay) -->
          <div class="next-task-timer-setup" id="focus-next-task-timer-setup" style="display: none; align-items: center; gap: 0.35rem;">
            <input type="number" class="inline-time-in min focus-next-min" min="0" max="999" placeholder="MM" value="25" style="width: 42px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; text-align: center; font-size: 0.75rem; padding: 0.2rem 0;">
            <span style="color: rgba(255,255,255,0.4); font-size: 0.75rem;">:</span>
            <input type="number" class="inline-time-in sec focus-next-sec" min="0" max="59" placeholder="SS" value="00" style="width: 42px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; text-align: center; font-size: 0.75rem; padding: 0.2rem 0;">
            <button type="button" class="next-timer-set-btn focus-next-set-btn" style="background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--accent-success); border-radius: 4px; cursor: pointer; padding: 0.2rem 0.5rem; font-size: 0.75rem;">Set</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Autosave Settings Modal Dialog -->
  <dialog id="autosave-modal" class="modal">
    <form method="dialog" class="modal-form">
      <div class="modal-header">
        <div class="modal-title-container">
          <h2 id="autosave-title">Autosave Settings</h2>
          <span class="modal-datetime-display"></span>
        </div>
      </div>
      <div class="modal-body" style="display: flex; flex-direction: column; gap: 1.25rem; padding: 1.5rem 1.75rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <input type="checkbox" id="autosave-enable" style="width: 1.15rem; height: 1.15rem; accent-color: var(--accent-primary); cursor: pointer;">
          <label for="autosave-enable" style="font-weight: 500; cursor: pointer; font-size: 0.95rem; user-select: none;">Enable Periodic Autosave (every 15 minutes)</label>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 1.25rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <input type="checkbox" id="autosave-file-enable" style="width: 1.15rem; height: 1.15rem; accent-color: var(--accent-primary); cursor: pointer;">
            <label for="autosave-file-enable" style="font-weight: 500; cursor: pointer; font-size: 0.95rem; user-select: none;">Also write backup to a local folder</label>
          </div>
          
          <div id="autosave-folder-selection" style="display: none; flex-direction: column; gap: 0.75rem; margin-left: 1.9rem; margin-top: 0.25rem; padding: 0.85rem; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px;">
            <button type="button" class="btn btn-secondary" id="autosave-select-folder-btn" style="width: fit-content; font-size: 0.8rem; padding: 0.45rem 0.9rem; border-radius: var(--radius-sm);">
              Select Folder Location
            </button>
            <div id="autosave-folder-info" style="font-size: 0.8rem; color: var(--text-muted); word-break: break-all; font-style: italic;">
              No folder selected
            </div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 1.25rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <input type="checkbox" id="autosave-jsonbin-enable" style="width: 1.15rem; height: 1.15rem; accent-color: var(--accent-primary); cursor: pointer;">
            <label for="autosave-jsonbin-enable" style="font-weight: 500; cursor: pointer; font-size: 0.95rem; user-select: none;">Also write backup to JSONBin.io</label>
          </div>
          
          <div id="autosave-jsonbin-selection" style="display: none; flex-direction: column; gap: 0.75rem; margin-left: 1.9rem; margin-top: 0.25rem; padding: 0.85rem; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px;">
            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
              <label for="jsonbin-api-key" style="font-size: 0.8rem; color: var(--text-main); font-weight: 500;">JSONBin.io Master Key</label>
              <input type="password" id="jsonbin-api-key" placeholder="Enter Master Key..." style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); padding: 0.4rem 0.6rem; color: #fff; font-size: 0.85rem;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
              <label for="jsonbin-bin-id" style="font-size: 0.8rem; color: var(--text-main); font-weight: 500;">Bin ID (Optional, will auto-create if empty)</label>
              <input type="text" id="jsonbin-bin-id" placeholder="Enter Bin ID (Optional)..." style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm); padding: 0.4rem 0.6rem; color: #fff; font-size: 0.85rem;">
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="autosave-sync-now-btn" style="display: none;">Sync Now</button>
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-left: auto;">
          <button type="button" class="btn btn-secondary" id="autosave-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="autosave-save-btn">Save Settings</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- Main JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
